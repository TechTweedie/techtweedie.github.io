name: Capture CMP browser evidence

on:
  workflow_dispatch:
  push:
    branches: [v2]
    paths:
      - scripts/cmp-browser-evidence.cjs
      - .github/workflows/cmp-browser-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright Chromium
        run: |
          mkdir -p /tmp/cmp-audit
          npm install --prefix /tmp/cmp-audit --no-save --no-package-lock playwright@1.56.1
          /tmp/cmp-audit/node_modules/.bin/playwright install --with-deps chromium
      - name: Capture browser evidence
        env:
          NODE_PATH: /tmp/cmp-audit/node_modules
        run: node scripts/cmp-browser-evidence.cjs
      - name: Add findings to workflow summary
        if: always()
        run: |
          if [ -f cmp-evidence/README.md ]; then
            cat cmp-evidence/README.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'CMP audit did not produce a report; inspect runner logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save screenshots, traces and logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: techtweedie-cmp-playwright-evidence
          path: cmp-evidence/
          retention-days: 30
          if-no-files-found: warn

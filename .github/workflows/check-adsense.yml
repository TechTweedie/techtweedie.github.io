name: AdSense readiness checks
on:
  push:
    branches: [v2]
    paths:
      - "hugo.yaml"
      - "layouts/**"
      - "content/privacy-policy/**"
      - "content/cookie-policy/**"
      - "static/ads.txt"
      - "scripts/check-adsense-config.mjs"
      - ".github/workflows/check-adsense.yml"
  pull_request:
    branches: [v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify AdSense and consent scaffolding
        run: node scripts/check-adsense-config.mjs
